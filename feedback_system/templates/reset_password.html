{% extends 'base.html' %}
{% block title %}Reset password — Faculty Feedback{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="eyebrow">Forgot password</div>
    <h2>Enter code &amp; new password</h2>
    <p class="sub" style="margin-bottom:1.2rem">Resetting the password for <strong>{{ ident }}</strong>.
      The 6-digit code expires in 10 minutes.</p>
    <form method="post" autocomplete="off" class="card">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="code">6-digit code</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               placeholder="123456" autocomplete="one-time-code" required autofocus
               style="font-size:1.4rem;letter-spacing:.35em;text-align:center">
      </div>
      <div class="field"><label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" minlength="8" required>
        <div class="hint">At least 8 characters.</div></div>
      <div class="field"><label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required></div>
      <button class="btn btn-block" type="submit">Reset password</button>
    </form>
    <form method="post" style="margin-top:.8rem;display:flex;gap:.6rem;flex-wrap:wrap">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="resend">
      <button class="btn btn-ghost btn-sm" type="submit">Resend code</button>
      <a class="btn btn-ghost btn-sm" href="{{ url_for('auth.forgot_password') }}">Start over</a>
    </form>
  </div>
</div>
{% endblock %}
