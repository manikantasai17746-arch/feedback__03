{% extends 'base.html' %}
{% block title %}Dean Login — Faculty Feedback{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="role-tabs">
      <a href="{{ url_for('auth.student_login') }}">Student</a>
      <a href="{{ url_for('auth.teacher_login') }}">Teacher</a>
      <a href="{{ url_for('auth.hod_login') }}">HOD</a>
      <a href="{{ url_for('auth.dean_login') }}" class="active">Dean</a>
      <a href="{{ url_for('auth.admin_login') }}">Admin</a>
    </div>
    <div class="eyebrow">Dean Login</div>
    <h2>Dean Portal</h2>
    <p class="sub" style="margin-bottom:1.2rem">Sign in with your employee code for publication monitoring and department analytics.</p>
    <form method="post" autocomplete="off" class="card">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="emp_code">Employee Code</label>
        <input type="text" id="emp_code" name="emp_code" placeholder="e.g. 5001" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="btn btn-block" type="submit">Log In</button>
    </form>
  </div>
</div>
{% endblock %}
