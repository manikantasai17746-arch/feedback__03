{% extends 'base.html' %}
{% block title %}Error {{ code }} — Faculty Feedback{% endblock %}
{% block body %}
<div class="card" style="max-width:520px;margin:40px auto;text-align:center">
  <h1>{{ code }}</h1>
  <p class="sub">{{ message }}</p>
  <div class="btn-row" style="justify-content:center">
    <a class="btn" href="{{ url_for('auth.student_login') }}">Home</a>
    {% if user %}<a class="btn btn-ghost" href="{{ url_for('auth.logout') }}">Logout</a>{% endif %}
  </div>
</div>
{% endblock %}
